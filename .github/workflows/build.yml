name: Build rootless DEB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockscreen-brightness-slider-16-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: |
          chmod 755 layout/DEBIAN/postinst
          make clean package FINALPACKAGE=1

      - name: Validate package
        run: |
          set -euo pipefail
          brew install dpkg

          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          test "$(dpkg-deb -f "${debs[0]}" Architecture)" = iphoneos-arm64
          test "$(dpkg-deb -f "${debs[0]}" Package)" = com.551.lockscreenbrightnessslider16

          dpkg-deb -x "${debs[0]}" "$RUNNER_TEMP/lsbs-check"
          binary="$RUNNER_TEMP/lsbs-check/var/jb/Library/MobileSubstrate/DynamicLibraries/LockscreenBrightnessSlider16.dylib"

          test -s "$binary"
          xcrun lipo "$binary" -verify_arch arm64 arm64e

      - name: Research QuickActions DND implementation
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/Cxs1125/cxs1125.github.io/6232ca47b0949eb609964c829593475c01bc0f13/debs/com.cameronkatri.quickactions_1.0.0-2_iphoneos-arm64.deb"
          curl -L --fail --retry 3 "$url" -o "$RUNNER_TEMP/quickactions.deb"
          rm -rf "$RUNNER_TEMP/quickactions"
          mkdir -p "$RUNNER_TEMP/quickactions"
          dpkg-deb -x "$RUNNER_TEMP/quickactions.deb" "$RUNNER_TEMP/quickactions"
          dylib="$RUNNER_TEMP/quickactions/var/jb/Library/MobileSubstrate/DynamicLibraries/QuickActions.dylib"

          echo "=== ALL STRINGS ==="
          strings -a "$dylib"

          echo "=== OBJC METADATA AROUND CATEGORIES / DND METHODS ==="
          otool -ov "$dylib" > "$RUNNER_TEMP/qa-objc.txt"
          python3 - "$RUNNER_TEMP/qa-objc.txt" <<'PY'
          import sys
          lines=open(sys.argv[1], errors='replace').read().splitlines()
          needles=('objc_catlist','__Actions','setDoNotDisturb:','updateDND:','stateService:didReceiveDoNotDisturbStateUpdate:','CSQuickActions')
          hits=sorted({i for i,l in enumerate(lines) if any(n in l for n in needles)})
          blocks=[]
          for i in hits:
              a=max(0,i-55); b=min(len(lines),i+70)
              if blocks and a<=blocks[-1][1]:
                  blocks[-1]=(blocks[-1][0],max(blocks[-1][1],b))
              else:
                  blocks.append((a,b))
          for a,b in blocks:
              print(f'--- lines {a+1}-{b} ---')
              print('\n'.join(lines[a:b]))
          PY

          echo "=== NM ALL RELEVANT ==="
          nm -a -nm "$dylib" | grep -Ei 'logos|DND|disturb|quick|action|stateService|CSQuick' || true

          echo "=== DISASSEMBLY CALLS / SYMBOLS ==="
          otool -tvV "$dylib" | grep -Ei -C 12 'setDoNotDisturb|updateDND|stateService|CSQuick|DND|objc_msgSend' || true

      - uses: actions/upload-artifact@v4
        with:
          name: LockscreenBrightnessSlider16-rootless
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish latest DEB only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version: //p' control)"
          current="v${version}"

          if gh release view "$current" >/dev/null 2>&1; then
            gh release upload "$current" packages/*.deb --clobber
          else
            gh release create "$current" packages/*.deb \
              --target "$GITHUB_SHA" \
              --title "Lockscreen Brightness Slider 16 ${version}" \
              --notes "Rootless iOS 16 Dopamine build."
          fi

          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            [ "$tag" = "$current" ] && continue
            gh release delete "$tag" --cleanup-tag -y
          done

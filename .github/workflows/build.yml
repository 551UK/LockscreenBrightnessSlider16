name: Build rootless DEB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockscreen-brightness-slider-16-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: |
          chmod 755 layout/DEBIAN/postinst
          make clean package FINALPACKAGE=1

      - name: Validate package
        run: |
          set -euo pipefail
          brew install dpkg

          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          test "$(dpkg-deb -f "${debs[0]}" Architecture)" = iphoneos-arm64
          test "$(dpkg-deb -f "${debs[0]}" Package)" = com.551.lockscreenbrightnessslider16

          dpkg-deb -x "${debs[0]}" "$RUNNER_TEMP/lsbs-check"
          binary="$RUNNER_TEMP/lsbs-check/var/jb/Library/MobileSubstrate/DynamicLibraries/LockscreenBrightnessSlider16.dylib"

          test -s "$binary"
          xcrun lipo "$binary" -verify_arch arm64 arm64e

      - name: Research QuickActions DND implementation
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/Cxs1125/cxs1125.github.io/6232ca47b0949eb609964c829593475c01bc0f13/debs/com.cameronkatri.quickactions_1.0.0-2_iphoneos-arm64.deb"
          curl -L --fail --retry 3 "$url" -o "$RUNNER_TEMP/quickactions.deb"
          rm -rf "$RUNNER_TEMP/quickactions"
          mkdir -p "$RUNNER_TEMP/quickactions"
          dpkg-deb -x "$RUNNER_TEMP/quickactions.deb" "$RUNNER_TEMP/quickactions"
          echo "=== FILES ==="
          find "$RUNNER_TEMP/quickactions" -type f -maxdepth 12 -print
          echo "=== DYLIB STRINGS ==="
          find "$RUNNER_TEMP/quickactions" -type f \( -name '*.dylib' -o -perm -111 \) -print0 | while IFS= read -r -d '' file; do
            echo "--- $file ---"
            strings -a "$file" | grep -Ei 'disturb|dnd|focus|quick|accessory|title|label|notification|cover|action|toggle|localized|status|banner' || true
            echo "=== OTOOL OBJC $file ==="
            otool -ov "$file" | grep -Ei -C 3 'disturb|dnd|focus|quick|accessory|title|label|notification|cover|action|toggle|localized|status|banner' || true
            echo "=== NM $file ==="
            nm -m "$file" | grep -Ei 'disturb|dnd|focus|quick|accessory|title|label|notification|cover|action|toggle|localized|status|banner' || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: LockscreenBrightnessSlider16-rootless
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish latest DEB only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version: //p' control)"
          current="v${version}"

          if gh release view "$current" >/dev/null 2>&1; then
            gh release upload "$current" packages/*.deb --clobber
          else
            gh release create "$current" packages/*.deb \
              --target "$GITHUB_SHA" \
              --title "Lockscreen Brightness Slider 16 ${version}" \
              --notes "Rootless iOS 16 Dopamine build."
          fi

          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            [ "$tag" = "$current" ] && continue
            gh release delete "$tag" --cleanup-tag -y
          done
